name = "primefixpros"
main = ".open-next/worker.js"
compatibility_date = "2026-09-24"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = true

# Set only in the Worker. Local Next.js leaves this unset and reads production D1.
[vars]
CMS_RUNTIME = "cloudflare"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "primefixpros"

[[d1_databases]]
binding = "CMS_DB"
database_name = "primefixpros-content"
database_id = "a7b9675c-46b4-481e-a7ce-447985f5b63b"

[[r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "primefixpros-media"

# Serve the Worker on the live site through the existing proxied DNS zone.
[[routes]]
pattern = "primefixpros.com/*"
zone_name = "primefixpros.com"

[[routes]]
pattern = "www.primefixpros.com/*"
zone_name = "primefixpros.com"
